# ===== 官网门户静态站部署编排（临时版） =====
# 与 Nuxt 版保持同一对外契约：host 网络 + 仅监听 127.0.0.1:3000，
# 由宿主机 FL nginx（host 80/443）反代 www 域名对外暴露，故前端反代无需改动。
# 站点内容：仓库 yidao-static-site/index.html → 服务器 ${SITE_DIR}/index.html
services:
  portal:
    image: ${PORTAL_STATIC_IMAGE:-nginx:1.27-alpine}
    container_name: hrwai-portal
    restart: unless-stopped
    network_mode: host
    volumes:
      # 站点目录（只读挂载，更新 HTML 后无需重建镜像）
      - ${SITE_DIR}:/usr/share/nginx/html:ro
      # 仅监听回环 127.0.0.1:3000 的 server 配置
      - ${DEPLOY_PATH}/deploy/nginx.portal.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
