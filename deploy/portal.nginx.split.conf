# ===== 官网门户（hrwai-portal）www 分流 server 块 =====
# 由 CI 部署脚本幂等追加到 forklift-frontend-prod 的 nginx-host.conf 末尾：
#   grep -q 'PORTAL NGINX SPLIT' ... || cat >> ...
# 追加后重启 frontend 容器（envsubst 重渲染配置）。
# 注意：monorepo CD 重新部署会覆盖 nginx-host.conf，门户 CI 下次部署会重新注入。

# ===== PORTAL NGINX SPLIT BEGIN =====
server {
    listen 51820;
    # www 子域名（任意根域）进门户；其余子域名走 default_server（原 SPA）
    server_name ~^www\..+$;

    # 整站转发到门户 Nitro（/api 与 /static 由 Nitro 内部代理到后端）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
# ===== PORTAL NGINX SPLIT END =====
