# 官网门户静态站 nginx 配置
# host 网络模式下仅监听回环：由宿主机 FL nginx 反代 www 域名对外暴露
server {
    listen 127.0.0.1:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    # 注意：text/html 已在 nginx 默认类型表中，重复声明会产生 warning
    gzip_types text/css application/javascript;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查探针（不记日志）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
