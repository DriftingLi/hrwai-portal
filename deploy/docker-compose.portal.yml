# ===== 官网门户部署编排（PVE 宿主机 Docker 直连，由 CI 部署脚本生成 .env 后使用） =====
services:
  portal:
    image: ${PORTAL_IMAGE}
    container_name: hrwai-portal
    restart: unless-stopped
    # host 网络（与 forklift-frontend-prod 一致）：Nitro 直接监听宿主机回环，
    # SSR 直连宿主后端；由 FL 前端 nginx（host 80/443）反代 www 域名对外暴露
    network_mode: host
    environment:
      # 仅监听回环：FL nginx 经 127.0.0.1:3000 反代，避免宿主机端口对外暴露
      HOST: 127.0.0.1
      # SSR 直连后端内部地址（production=127.0.0.1:8080；testing=127.0.0.1:18080）
      NUXT_API_INTERNAL_BASE: ${NUXT_API_INTERNAL_BASE}
      PORTAL_SITE_URL: ${PORTAL_SITE_URL}
      NUXT_PUBLIC_BAIDU_VERIFICATION: ${NUXT_PUBLIC_BAIDU_VERIFICATION}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
