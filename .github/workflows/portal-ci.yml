# ===== 官网门户 CI/CD（临时静态站版） =====
# 当前对外站点为单页静态 HTML：yidao-static-site/index.html
#   - 不再构建/推送 Nuxt 镜像，部署改为：上传 HTML → nginx 静态容器（host 网络 127.0.0.1:3000）
#   - 宿主机 FL nginx 反代 www 域名的配置无需改动
# 触发策略：
#   - 任意分支 push        → check + 自动部署 testing（验证通过后 PR 进 main）
#   - PR 进 main            → check（分支保护要求）
#   - main push（PR 合并后）→ check + 自动部署 production
#   - workflow_dispatch    → 手动部署（可指定 environment / ref）
# 使用前需配置的 Secrets / Variables：
#   环境级 Secrets (production / testing): SSH_HOST / SSH_PORT / SSH_USER / SSH_PRIVATE_KEY
#          production=pve-02 宿主机直连；testing=pve-01 宿主机直连
#   仓库级 Variables（可选）: NGINX_IMAGE（默认 nginx:1.27-alpine）
name: portal-ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 部署的 commit SHA（留空用分支 HEAD）
        type: string
        default: ""
      environment:
        description: 部署目标环境
        type: choice
        default: production
        options:
          - production
          - testing

concurrency:
  # 同一环境同时只允许一条部署；按实际目标环境分组（push 时无 inputs）
  group: portal-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment || 'production') || (github.ref == 'refs/heads/main' && 'production' || 'testing') }}
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/hrwai-portal
  SITE_DIR: /opt/hrwai-portal/site

jobs:
  # ============================================================
  # Stage 1: 检查（typecheck + test）——分支保护要求的 status check
  # 注：静态站不参与部署，此处仅校验仓库内 Nuxt 源码仍可编译通过
  # ============================================================
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # ============================================================
  # Stage 2: 通过公网 SSH 直连 PVE 宿主机部署静态站
  #   分支 push → testing；main push → production；手动 → 指定环境
  #   production=pve-02(SSH_HOST:SSH_PORT)、testing=pve-01(SSH_HOST:SSH_PORT)
  #   均为宿主机 Docker 直连，无跳板
  # ============================================================
  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 兜底：跨境 SSH 或远程命令异常挂起时不要无限占用 runner
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.environment || 'production') || (github.ref == 'refs/heads/main' && 'production' || 'testing') }}
    env:
      NGINX_IMAGE: ${{ vars.NGINX_IMAGE || 'nginx:1.27-alpine' }}
      # SSH 连接（公网直连 PVE 宿主机）
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      # --------------------------------------------------------
      # Step 2.1: 配置 SSH（直连 PVE 宿主机）
      # --------------------------------------------------------
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" \
            -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config << EOF
          Host target
              HostName $SSH_HOST
              Port $SSH_PORT
              User $SSH_USER
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking no
          EOF

      # --------------------------------------------------------
      # Step 2.2: 上传静态站点与编排文件
      # （境外 runner → 国内服务器跨境 SSH 链路存在概率性 RST：
      #   TCP 可建立但握手期被远端关闭（Connection closed），
      #   对所有 ssh/scp 命令做 5 次重试，间隔 15s）
      # --------------------------------------------------------
      - name: 上传部署文件
        run: |
          retry() {
            for i in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "⚠️ 第 $i 次连接失败（跨境 SSH 链路抖动），15s 后重试..."
              sleep 15
            done
            echo "❌ 重试 5 次仍失败"; return 1
          }
          retry ssh -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=30 \
            "target" "mkdir -p $DEPLOY_PATH/deploy $SITE_DIR"
          retry scp -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=30 \
            yidao-static-site/index.html \
            "target:$SITE_DIR/index.html"
          retry scp -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=30 \
            deploy/docker-compose.portal-static.yml deploy/nginx.portal.conf deploy/deploy-portal-static.sh \
            "target:$DEPLOY_PATH/deploy/"
          retry ssh -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=30 \
            "target" "chmod +x $DEPLOY_PATH/deploy/deploy-portal-static.sh"

      # --------------------------------------------------------
      # Step 2.3: 远程启动/替换静态站容器
      #   - 先移除同名旧容器（可能是上一版 Nuxt 镜像实例），避免占用 127.0.0.1:3000
      #   - 站点目录为只读挂载，后续仅更新 HTML 即可生效
      # --------------------------------------------------------
      - name: 执行远程部署
        run: |
          retry() {
            for i in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "⚠️ 第 $i 次连接失败（跨境 SSH 链路抖动），15s 后重试..."
              sleep 15
            done
            echo "❌ 重试 5 次仍失败"; return 1
          }
          # env 并入同一条连接执行，减少跨境 SSH 握手次数
          retry ssh -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=30 \
            "target" \
            "cd $DEPLOY_PATH && env \
              DEPLOY_PATH=$DEPLOY_PATH \
              SITE_DIR=$SITE_DIR \
              PORTAL_STATIC_IMAGE=$NGINX_IMAGE \
              bash deploy/deploy-portal-static.sh"

      # --------------------------------------------------------
      # Step 2.4: 测试环境部署验证后停止容器，节省资源
      # --------------------------------------------------------
      - name: 测试环境停止容器
        if: success() && (
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment || 'production') == 'testing') ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main'))
        run: |
          echo "测试环境部署成功，停止容器以释放资源..."
          # 非关键步骤：重试 3 次后放弃（不影响部署结果）
          retry() {
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "⚠️ 第 $i 次连接失败，15s 后重试..."
              sleep 15
            done
            echo "⚠️ 停止容器重试 3 次仍失败，跳过（不影响部署结果）"; return 0
          }
          retry ssh -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=30 \
            "target" \
            "cd $DEPLOY_PATH && docker compose -f deploy/docker-compose.portal-static.yml down 2>&1 || true"
          echo "✅ 测试环境容器已停止"

      - name: 清理 SSH 密钥
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
