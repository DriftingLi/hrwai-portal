# ===== 官网门户 CI（独立仓库） =====
# 构建 + 镜像推送 + 部署。
# 使用前需配置以下 Secrets：
#   DOCKER_REGISTRY / DOCKER_USERNAME / DOCKER_PASSWORD — 镜像仓库
#   SERVER_HOST / SERVER_SSH_KEY — 部署目标服务器（如需要）
#   NUXT_API_INTERNAL_BASE / PORTAL_SITE_URL / NUXT_PUBLIC_BAIDU_VERIFICATION — 构建期配置
# 注意：站点地址用 PORTAL_SITE_URL（www 归一化在构建期完成；PORTAL_SITE_URL 会绕过）
name: portal-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # 后端公开接口需在构建期可达（预渲染首页 + sitemap 全量文章）
        # 不可达时构建不失败，仅精选内容降级为空（见页面实现）
        run: npm run build
        env:
          NUXT_API_INTERNAL_BASE: ${{ secrets.NUXT_API_INTERNAL_BASE }}
          PORTAL_SITE_URL: ${{ secrets.PORTAL_SITE_URL }}
          NUXT_PUBLIC_BAIDU_VERIFICATION: ${{ secrets.NUXT_PUBLIC_BAIDU_VERIFICATION }}

  # ===== 镜像构建与部署（main 分支）=====
  # TODO(部署): 按实际环境填写以下步骤，或改用自有部署流程
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          docker build \
            --build-arg NUXT_API_INTERNAL_BASE="${{ secrets.NUXT_API_INTERNAL_BASE }}" \
            --build-arg PORTAL_SITE_URL="${{ secrets.PORTAL_SITE_URL }}" \
            --build-arg NUXT_PUBLIC_BAIDU_VERIFICATION="${{ secrets.NUXT_PUBLIC_BAIDU_VERIFICATION }}" \
            -t ${{ secrets.DOCKER_REGISTRY }}/hrwai-portal:${{ github.sha }} \
            -t ${{ secrets.DOCKER_REGISTRY }}/hrwai-portal:latest \
            .
          docker push ${{ secrets.DOCKER_REGISTRY }}/hrwai-portal:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/hrwai-portal:latest

      # TODO(部署): 服务器侧更新流程（SSH pull & restart 或 compose 滚动更新）
