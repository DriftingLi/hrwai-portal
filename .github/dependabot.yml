version: 2
updates:
  # npm 依赖：minor + patch 合成一个 PR，major 单独提 PR 便于逐个评估（如 Nuxt / Vue 大版本）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    # include: scope 会自动追加 (deps)/(deps-dev)，prefix 里不要再写一遍，
    # 否则提交信息会变成 chore(deps)(deps)：…
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # TS 7 是原生编译器，只导出 unstable/* API，不再提供 typescript/lib/tsc；
      # vue-tsc（含最新 3.3.13）与 nuxt typecheck 都依赖经典编译器 API，装上即崩。
      # 等 vue-tsc 支持 TS 7 后删掉这条，届时 Dependabot 会重新提 major。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      # 同一代的 Nuxt SEO 模块必须一起升：robots 7 + sitemap 8 实测会让构建报 EISDIR
      # （两者分别依赖 nuxt-site-config 4 / 5）。所以这一对不按 major 拆分，永远合成一个 PR。
      # 分组按顺序匹配，这条必须排在 *（minor-and-patch）之前。
      nuxt-seo:
        applies-to: "version-updates"
        patterns:
          - "@nuxtjs/robots"
          - "@nuxtjs/sitemap"
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions：每个 action 一个 PR，量很小
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # actions 的 scope 也是 deps，带上会更像 chore(deps)；这里改用固定前缀 chore(ci)
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
